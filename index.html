function leader(){let a=entries().map(([id,p])=>({id,...p,points:pts(p.stats)+(phase()==='finished'&&missions[p.mission||0][2](p.stats)?25:0)})).sort((a,b)=>b.points-a.points);return `<table class="rank"><thead><tr><th>Rank</th><th>Country</th><th>Composite score</th><th>Growth</th><th>Wellbeing</th><th>Treasury</th></tr></thead><tbody>${a.map((p,i)=>`<tr><td>${i===0?'👑 ':''}#${i+1}</td><td><b>${esc(p.name)}</b></td><td>${p.points}</td><td>${b(p.stats.growth)}%</td><td>${b(p.stats.happiness)}</td><td>${b(p.stats.treasury)}</td></tr>`).join('')}</tbody></table>`}
function status(s){return `<div class="stats">${[['GDP growth',b(s.growth)+'%'],['Inflation',b(s.inflation)+'%'],['Fiscal strength',b(s.budget)],['Public happiness',b(s.happiness)],['Trade strength',b(s.trade)],['Treasury',b(s.treasury)+' cr'],['Composite score',pts(s)]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`}
function eventCard(){return `<div class="event"><div class="micro">⚡ WORLD EVENT // ROUND ${chosen()}</div><h2>${esc(rn().title)}</h2><p class="sub">${esc(rn().desc)}</p></div>`}
function history(p){let h=p.history||{},keys=Object.keys(h).sort((a,b)=>a-b);if(!keys.length)return '<p class="sub">Your decisions will appear after the first results.</p>';return keys.map(k=>{let x=h[k],d=x.delta||{};return `<div class="log"><div class="row between"><b>Round ${k}: ${esc(worlds[k-1].label)}</b><b>${x.before} → ${x.score} points</b></div><div class="tiny">Spent ${x.spent} credits · Shock ${x.uncertainty>0?'+':''}${b(x.uncertainty)} · Trade ${x.tradeCredits>=0?'+':''}${x.tradeCredits||0} credits</div><div class="tiny">${['growth','inflation','budget','happiness','trade'].map(v=>`${v}: ${d[v]>=0?'+':''}${b(d[v])}`).join(' · ')}</div></div>`}).join('')}
function missionMetric(p,s){switch(Number(p.mission||0)){case 0:return s.happiness;case 1:return s.trade;case 2:return -Math.abs(s.inflation-2.5);case 3:return s.budget;default:return s.growth}}
const expertCache=new Map();const reportContexts=[
 ['Nation building','Scarce capital means an investment must beat its opportunity cost. Infrastructure and skills can mature in later rounds, but cash reserves also buy flexibility.'],
 ['Energy security','An energy shock increases cost pressure. Compare near-term relief with investments that gradually reduce future vulnerability.'],
 ['Trade conflict','Retaliation may raise import costs. Compare market-access negotiations, export support and domestic resilience, including their fiscal costs.'],
 ['Technology transition','Productivity improvements and displaced-worker support pull in different directions. An effective mix must consider both.'],
 ['Climate resilience','Disaster relief is immediate; adaptation and food resilience may protect the next period. Not every gain is captured by the current score.']];
function reportState(p,r){let h=p.history?.[r];if(!h?.priorStats)return null;let event=worlds[r-1],before=h.priorStats,base={...p,stats:before,assets:h.priorAssets||{}},offers=Object.values(game?.offers||{}).filter(x=>x.round===Number(r)&&(x.status==='accepted'||x.status==='settled'));let match=Object.entries(game?.players||{}).find(([,v])=>v===p),id=match?.[0]||uid,limit=Math.floor(before.treasury);let keys=event.policies.map(x=>x[0]);const evaluation=alloc=>{let out=compute(base,{alloc},Number(r),offers,room,id),s=out.stats;return {alloc:{...alloc},out,objective:pts(s)+0.14*s.treasury+1.5*missionMetric(p,s)}};let visited=0;const tryEval=a=>{visited++;return evaluation(a)};let best=tryEval(Object.fromEntries(keys.map(k=>[k,0])));let seeds=[best.alloc,Object.fromEntries(keys.map((k,i)=>[k,i===0?limit:0]))];for(let seed of seeds){let current=tryEval(seed),improved=true,passes=0;while(improved&&passes++<20){improved=false;let choice=current;for(let from of [...keys,null])for(let to of keys){if(from===to)continue;for(let amount of [1,5,10,20]){let a={...current.alloc};if(from&&a[from]<amount)continue;if(!from&&Object.values(a).reduce((n,v)=>n+v,0)+amount>limit)continue;if(from)a[from]-=amount;a[to]+=amount;let q=tryEval(a);if(q.objective>choice.objective+1e-8)choice=q;}}if(choice.objective>current.objective+1e-8){current=choice;improved=true}}if(current.objective>best.objective)best=current}let selected=Object.fromEntries(keys.map(k=>[k,Number(h.allocation?.[k]||0)])),actual=evaluation(selected);return {event,before,limit,keys,selected,actual,best,visited,evaluation,p,r};}
function pct(v){return (v>=0?'+':'')+Number(v).toFixed(1)}
function scoreTerms(s){return {growth:8*s.growth,inflation:-6*Math.abs(s.inflation-3),fiscal:.8*s.budget,welfare:1.2*s.happiness,trade:.8*s.trade}}
function changeDescription(base,alt){let terms=scoreTerms(alt),old=scoreTerms(base),parts=Object.keys(terms).map(k=>({k,d:terms[k]-old[k]})).filter(x=>Math.abs(x.d)>.02).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));return parts.slice(0,3).map(x=>`${x.k} ${pct(x.d)} score pts`).join('; ')||'little immediate score difference'}
function marginalAnalysis(ctx,i){let {event,best,keys,limit,evaluation}=ctx,k=keys[i],a=Number(best.alloc[k]||0),c=best.objective,above=null,below=null;for(let [dir,name] of [[5,'more'],[-5,'less']]){let x={...best.alloc,[k]:a+dir};if(x[k]<0||Object.values(x).reduce((n,v)=>n+v,0)>limit)continue;let result=evaluation(x);if(dir>0)above=result;else below=result}
let p=event.policies[i],unit=p[3],gain=Object.entries(unit).filter(([,v])=>v!==0).map(([metric,v])=>`${metric}: ${pct(v*.5)}`).join(' · ')||'effect depends on accumulated assets';let reason=a===0?'Not funded in the highest-scoring immediate mix.':a===30?'At the available treasury ceiling.':`Funded at ${a} whole credits.`;let note=above?`An extra 5 credits, holding other policies fixed, would change the objective by ${pct(above.objective-c)} and prosperity by ${pct(pts(above.out.stats)-pts(best.out.stats))}.`:'An extra 5 credits is unavailable under the current limit or policy ceiling.';let down=below?`Cutting 5 credits would change the objective by ${pct(below.objective-c)}, leaving five extra treasury credits.`:'Five fewer credits is not possible at zero allocation.';return `<details class="policy-explain"><summary><b>${esc(p[1])}</b><span>${a} credits <small>Why this much? ▾</small></span></summary><div class="policy-explain-body"><p><b>Economic purpose:</b> ${esc(p[2])}</p><p><b>Why ${a}?</b> ${esc(reason)} ${esc(note)} ${esc(down)}</p><p><b>Effect per five credits in this round:</b> ${esc(gain)}. These are direct model effects before crisis, uncertainty, caps and delayed assets. Future payoffs may change the real strategic value.</p><p><b>Opportunity cost:</b> Five credits here cannot simultaneously finance another policy. If the treasury is already committed, adding five requires reducing another allocation; test that in the simulator below.</p></div></details>`}
function metricRows(a,b){return ['growth','inflation','budget','happiness','trade','treasury'].map(k=>`<tr><td>${esc(k)}</td><td>${btoaSafe(a[k])}</td><td>${btoaSafe(b[k])}</td><td class="${a[k]-b[k]>=0?'good':'danger'}">${pct(a[k]-b[k])}</td></tr>`).join('')}
function btoaSafe(x){return Number(x||0).toFixed(1)}
function expertReport(p,r){let key=room+':'+r+':'+(p.name||'');if(expertCache.has(key))return expertCache.get(key);let ctx=reportState(p,r);if(!ctx)return '<div class="note">This older result lacks the starting economic snapshot needed for a faithful counterfactual. Start a new arena for full analysis.</div>';let {event,selected,actual,best,visited,keys,limit}=ctx,policies=event.policies.map(x=>`<tr><td>${esc(x[1])}</td><td>${selected[x[0]]||0}</td><td><b>${best.alloc[x[0]]||0}</b></td><td>${(best.alloc[x[0]]||0)-(selected[x[0]]||0)>=0?'+':''}${(best.alloc[x[0]]||0)-(selected[x[0]]||0)}</td></tr>`).join('');let main=changeDescription(actual.out.stats,best.out.stats);let mission=['happiness','trade','inflation stability','fiscal reserves','growth'][p.mission||0];let html=`<section class="panel c12 expert-report" id="expert-report"><div class="micro">🎓 ECONOMIC INTELLIGENCE · ROUND ${r}</div><h2>Why did the expert allocate exactly these credits?</h2><p class="sub">${esc(reportContexts[r-1]?.[1]||'Every credit has an opportunity cost.')} We checked <b>${visited.toLocaleString()}</b> candidate integer-credit allocations with up to ${limit} treasury credits. The benchmark optimises <b>this round's model objective</b>, not an entire national economic future.</p><div class="grid"><div class="c6 note"><div class="micro">YOUR DECISION</div><h2>${pts(actual.out.stats)}</h2><span class="tiny">Prosperity · treasury ${b(actual.out.stats.treasury)} cr</span></div><div class="c6 note"><div class="micro">BEST MODEL BENCHMARK</div><h2>${pts(best.out.stats)}</h2><span class="tiny">Prosperity · treasury ${b(best.out.stats.treasury)} cr</span></div></div><h3>Exact allocation comparison</h3><table class="rank"><thead><tr><th>Policy</th><th>You</th><th>Benchmark</th><th>Reallocate</th></tr></thead><tbody>${policies}</tbody></table><div class="note"><b>Why the benchmark performs differently:</b> ${esc(main)}. Your national mission emphasises <b>${esc(mission)}</b>. The algorithm values 1 prosperity point at 1, 1 remaining treasury credit at 0.14, and 1 mission-indicator unit at 1.5. Mission importance is a model-design choice, not an economic law.</div><h3>Why EACH specific amount?</h3><p class="sub">Open a policy to see its marginal benefit, the test of 5 credits more/less, and the trade-off.</p>${event.policies.map((_,i)=>marginalAnalysis(ctx,i)).join('')}<div class="note"><b>What the full score includes</b><p>Growth × 8 + Fiscal × 0.8 + Happiness × 1.2 + Trade × 0.8 − 6 × |Inflation − 3|. Treasury matters separately in the expert objective. Thus "highest prosperity" and "best expert objective" need not be the same.</p><p><b>Counterfactual control:</b> We replay the same starting economy, accepted trades, crisis and deterministic uncertainty. We change only policy allocations, not what rival nations might do in response.</p></div><div class="whatif"><div class="micro">🔬 CHALLENGE THE EXPERT</div><h3>Can you find a smarter allocation?</h3><p class="sub">Move 5-credit steps. The right-hand metrics are recomputed locally — they do not alter live results.</p><div class="row"><button type="button" class="action alt" data-scenario="actual">Use my allocation</button><button type="button" class="action alt" data-scenario="best">Use expert's mix</button></div><div id="whatif-sliders">${event.policies.map(x=>`<label class="whatif-line"><span>${esc(x[1])}</span><input type="number" min="0" max="${maximum}" step="1" value="${best.alloc[x[0]]||0}" data-whatif="${esc(x[0])}"><b data-value="${esc(x[0])}">${best.alloc[x[0]]||0}</b></label>`).join('')}</div><div id="whatif-result"></div></div><p class="tiny">Educational simplification: the search looks ahead only one round. It does NOT prove globally optimal five-round performance. Policy effects are game mechanics rather than empirical forecasts; delayed impacts, strategic rival responses, and political constraints are simplified.</p></section>`;expertCache.set(key,html);return html}
function bindExpertReport(){let wrap=document.querySelector('#expert-report');if(!wrap||!me)return;let ctx=reportState(me,chosen());if(!ctx)return;let calculate=()=>{let alloc={};wrap.querySelectorAll('[data-whatif]').forEach(el=>alloc[el.dataset.whatif]=Number(el.value));let spent=Object.values(alloc).reduce((a,b)=>a+b,0),panel=wrap.querySelector('#whatif-result');if(spent>ctx.limit){panel.innerHTML=`<div class="note danger">Over budget: ${spent} / ${ctx.limit}. Reduce an allocation to see the economic outcome.</div>`;return}let obj=ctx.evaluation(alloc),result=obj.out.stats,base=ctx.best.out.stats;panel.innerHTML=`<div class="note"><b>Spending ${spent}/${ctx.limit}</b> · predicted prosperity <b>${pts(result)}</b> · expert objective <b>${obj.objective.toFixed(1)}</b> (${pct(obj.objective-ctx.best.objective)} vs benchmark)<div class="tiny">This is a same-round counterfactual, not a guaranteed real-world result.</div></div><table class="rank"><thead><tr><th>Metric</th><th>Your scenario</th><th>Expert</th><th>Difference</th></tr></thead><tbody>${metricRows(result,base).replace(/<td class="(good|danger)">([^<]*)<\/td>/g,(_,cls,val)=>`<td class="${cls}">${val}</td>`)}</tbody></table><div class="note">Main sources of score difference: ${esc(changeDescription(base,result))}.</div>`};wrap.querySelectorAll('[data-whatif]').forEach(el=>el.oninput=()=>{wrap.querySelector(`[data-value="${el.dataset.whatif}"]`).textContent=el.value;calculate()});wrap.querySelectorAll('[data-scenario]').forEach(el=>el.onclick=()=>{let values=el.dataset.scenario==='best'?ctx.best.alloc:ctx.selected;wrap.querySelectorAll('[data-whatif]').forEach(inp=>{inp.value=values[inp.dataset.whatif]||0;wrap.querySelector(`[data-value="${inp.dataset.whatif}"]`).textContent=inp.value});calculate()});calculate()}
function tradeLocked(){return !!game?.tradeClosed||entries().some(([,p])=>!!p.decisions?.[chosen()])}function tradeLog(){let all=Object.entries(game?.offers||{}).sort((a,b)=>(b[1].created||0)-(a[1].created||0));return `<section class="panel" style="margin-top:18px"><div class="micro">PUBLIC DIPLOMACY LEDGER</div><h3>🌍 All trade offers</h3><p class="tiny">Accepted offers transfer treasury at resolution, with transparent sender and receiver records.</p>${all.length?`<table class="rank"><thead><tr><th>Round</th><th>From</th><th>To</th><th>Credits</th><th>Status</th></tr></thead><tbody>${all.map(([,o])=>`<tr><td>${Number(o.round)||'-'}</td><td>${esc(game.players?.[o.from]?.name||'Unknown')}</td><td>${esc(game.players?.[o.to]?.name||'Unknown')}</td><td>${Number(o.credits)||0}</td><td>${esc(o.status||'pending')}</td></tr>`).join('')}</tbody></table>`:'<p class="sub">No trades yet.</p>'}</section>`}
function currentOffers(){return Object.entries(game.offers||{}).filter(([,o])=>o.round===chosen())}
function tradeUI(){let offers=currentOffers();return `<div class="panel c6"><div class="micro">DIPLOMATIC CHANNEL</div><h2>Trade & negotiate</h2><p class="sub">Offer a treasury transfer to another country. If accepted before resolution, both nations gain +1 trade strength per 5 credits transferred. Sender pays and receiver gains credits when the host resolves the round. Larger economies earn extra trade-strength points when supporting smaller economies. Trading stops the moment any team locks a strategy.</p>${phase()==='decision'&&!tradeLocked()?`<label class="field">Trading partner<select id="tradeTarget"><option value="">Choose a nation</option>${entries().filter(([id])=>id!==uid).map(([id,p])=>`<option value="${esc(id)}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Credits offered (5–20)<select id="tradeMoney">${[5,10,15,20].map(v=>`<option value="${v}">${v} credits</option>`).join('')}</select></label><button class="action alt" id="offer">Send trade offer ↗</button>`:'<p class="tiny">You may send offers while your cabinet decision is open.</p>'}<div style="margin-top:12px">${offers.filter(([,o])=>o.from===uid||o.to===uid).map(([id,o])=>{let other=game.players?.[o.from===uid?o.to:o.from]?.name||'Unknown';return `<div class="offer"><b>${o.from===uid?'Sent to':'Received from'} ${esc(other)}</b><p class="tiny">${o.credits} credits · ${esc(o.status||'pending')}</p>${o.to===uid&&o.status==='pending'&&phase()==='decision'&&!tradeLocked()?`<button class="action" data-accept="${esc(id)}">Accept offer</button> <button class="action alt" data-decline="${esc(id)}">Decline</button>`:''}</div>`}).join('')||'<div class="tiny">No negotiations yet.</div>'}</div></div>`}

let total=draftTotal(),maximum=Math.floor(me.stats.treasury);return `<div class="panel c8"><div class="row between"><div><div class="micro">THE CABINET ROOM</div><h2>Allocate your national budget</h2></div><span class="pill">MULTI-POLICY STRATEGY</span></div><p class="sub">Allocate any whole number of credits across three priorities. There is no round or policy cap; you cannot spend more than your available treasury. Unspent treasury carries forward, and future tax receipts replenish it.</p><div class="note"><div class="row between"><b>Allocated budget</b><b id="budget-total" class="${total>maximum?'danger':'good'}">${total} / ${maximum} credits</b></div><div class="bar" style="margin:10px 0"><i id="budget-progress" style="width:${Math.min(100,maximum?total/maximum*100:0)}%"></i></div><div class="tiny" id="budget-remaining">Treasury now ${b(me.stats.treasury)} cr · Available treasury · Expected remaining ${b(me.stats.treasury-total)} cr</div></div>${rn().policies.map(([id,label,description,delta,tag])=>`<div class="policy"><div class="sliderrow"><b>${esc(label)}</b><span class="spend" id="amount-${id}">${draft[id]||0} cr</span></div><p>${esc(description)} · ${esc(tag)}</p><input class="slider" data-slider="${id}" type="number" min="0" max="${maximum}" step="1" value="${draft[id]||0}"></div>`).join('')}<div class="row"><button id="commit" class="action" ${total>maximum?'disabled':''}>Lock in economic strategy ↗</button><span class="tiny">No changes after submission. Hold reserves by submitting 0 credits.</span></div></div>`}
function render(){if(!game)return;let body=topbar();if(role==='host'){let n=entries().length,done=entries().filter(([,p])=>p.decisions?.[chosen()]).length;body+=`<div class="grid"><div class="panel c8"><div class="micro">MISSION CONTROL</div><h2>${phase()==='lobby'?'The world is assembling':phase()==='finished'?'The world has a champion':`ROUND ${chosen()} · ${rn().label}`}</h2>${phase()==='lobby'?`<p class="sub">Project this room code. Teams join from their own laptops. Each team receives a secret mission.</p><div class="code">${room}</div><p class="tiny">${n}/60 nations joined</p><button class="action" id="start" ${n<2?'disabled':''}>Launch world simulation ↗</button>`:phase()==='decision'?`${eventCard()}<p class="sub">${done} of ${n} teams have submitted. Trade negotiations remain open until you resolve the round.</p><div class="bar"><i style="width:${n?100*done/n:0}%"></i></div><p><button class="action gold" id="resolve">Resolve economic round ↗</button></p><p class="tiny">For fair play, announce a consistent time limit externally. Resolving early applies the crisis even to countries that have not submitted.</p>`:phase()==='results'?`<p class="sub">Policies, negotiations, delayed effects and shocks have been applied.</p><div class="note">${esc(game.lastSummary||'Results published.')}</div><p><button class="action" id="next">${chosen()===5?'Crown the champions ↗':'Launch next round ↗'}</button></p>`:`<p class="sub">Review how economic trade-offs shaped the final world.</p><button class="action alt" id="reset">Exit arena</button>`}</div><div class="panel c4"><div class="micro">WORLD STATUS</div><h3>Live operations</h3><div class="kpi"><span>Connected nations</span><b>${n}</b></div><div class="kpi"><span>Round</span><b>${chosen()} / 5</b></div><div class="kpi"><span>Submitted</span><b>${phase()==='decision'?done+'/'+n:'—'}</b></div><div class="kpi"><span>Trade offers</span><b>${currentOffers().length}</b></div><div class="note">The rankings and changes update live. Only use the host device to advance rounds.</div></div><div class="panel c12"><h2>🏆 Live global rankings</h2>${leader()}</div><div class="panel c12"><h3>📡 Global economic bulletin</h3>${entries().map(([,p])=>`<div class="log"><b>${esc(p.name)}</b> · ${p.history?.[chosen()]?esc(p.history[chosen()].note):'No current outcome'}</div>`).join('')}</div></div>`}else{body+=`<div class="grid"><div class="panel c12"><div class="row between"><div><div class="micro">YOUR NATION</div><h2>${nationFor(me)[1]} ${esc(me.name)} <span class="tiny">· ${esc(nationFor(me)[2])}</span></h2></div><span class="pill">${phase()==='lobby'?'Awaiting host':`Round ${chosen()} / 5`}</span></div>${status(me.stats)}${phase()==="decision"||phase()==="lobby"?leaderCard(me,chosen()):""}<p class="note">🎯 <b>Your national mission: ${esc(missions[me.mission||0][0])}</b> — ${esc(missions[me.mission||0][1])} Completing it adds 25 bonus points at the end. Keep your objective private.</p></div>`;if(phase()==='lobby')body+=`<div class="panel c12"><h2>Nation registered</h2><p class="sub">Wait for the host to open the world economy.</p></div>`;else if(phase()==='decision')body+=`<div class="c12">${eventCard()}</div>${cabinet()}${tradeUI()}`;else if(phase()==='results')body+=`<div class="panel c12"><div class="micro">POST-CRISIS INTELLIGENCE</div><h2>Round ${chosen()} outcomes</h2><p class="sub">${esc(me.history?.[chosen()]?.note||'Your economic indicators have updated.')}</p>${leaderCard(me,chosen(),true)}${expertReport(me,chosen())}${history(me)}</div>`;else body+=`<div class="panel c12"><div class="micro">FINAL NATIONAL REPORT</div><h2>${esc(me.name)} · ${pts(me.stats)+(missions[me.mission||0][2](me.stats)?25:0)} total points</h2><div class="note">Base prosperity ${pts(me.stats)} + mission ${missions[me.mission||0][2](me.stats)?25:0} / 25 bonus.</div>${history(me)}</div>`;body+=`<div class="panel c12"><h2>🏆 Live world rankings ${phase()==='finished'?'(including mission bonuses)':''}</h2>${leader()}</div></div>`}body+=tradeLog();appEl.innerHTML=body;loadLeaderImages();if(role==='player'&&phase()==='results')bindExpertReport();document.getElementById('leader-react')?.addEventListener('click',showLeaderPopup);if(role==='player'&&phase()==='results'&&lastLeaderPopup!==room+':'+chosen()){lastLeaderPopup=room+':'+chosen();showLeaderPopup()}document.getElementById('leave')?.addEventListener('click',leave);document.getElementById('reset')?.addEventListener('click',leave);document.getElementById('start')?.addEventListener('click',()=>runTransaction(ref(db,`roomsV2/${room}`),v=>v&&v.host===uid&&v.phase==='lobby'?{...v,phase:'decision',round:1}:undefined));document.getElementById('next')?.addEventListener('click',nextRound);document.getElementById('resolve')?.addEventListener('click',resolveRound);document.querySelectorAll('[data-slider]').forEach(el=>el.addEventListener('input',()=>{draft[el.dataset.slider]=Math.max(0,Math.floor(Number(el.value)||0));let t=draftTotal(),limit=Math.floor(me.stats.treasury);document.getElementById('amount-'+el.dataset.slider).textContent=draft[el.dataset.slider]+' cr';let note=document.querySelector('#commit');note.disabled=t>limit;let summary=document.getElementById('budget-total');if(summary){summary.textContent=t+' / '+limit+' credits';summary.className=t>limit?'danger':'good';}let bar=document.getElementById('budget-progress');if(bar)bar.style.width=Math.min(100,limit?t/limit*100:0)+'%';let left=document.getElementById('budget-remaining');if(left)left.textContent='Treasury now '+b(me.stats.treasury)+' cr · Available treasury · Expected remaining '+b(me.stats.treasury-t)+' cr';}));document.getElementById('commit')?.addEventListener('click',submit);document.getElementById('offer')?.addEventListener('click',sendOffer);document.querySelectorAll('[data-accept]').forEach(el=>el.onclick=()=>respondOffer(el.dataset.accept,'accepted'));document.querySelectorAll('[data-decline]').forEach(el=>el.onclick=()=>respondOffer(el.dataset.decline,'declined'))}
async function submit(){let total=draftTotal(),limit=Math.floor(me.stats.treasury),alloc={};if(total>limit||total<0)return toast('Allocation exceeds your budget.');for(let p of rn().policies){let v=Number(draft[p[0]]||0);if(!Number.isInteger(v)||v<0||v>limit)return toast('Invalid policy allocation.');if(v)alloc[p[0]]=v;}let r=chosen();toast('Submitting strategy to Firebase…');try{if(game?.players?.[uid]?.decisions?.[r])return toast('Decision already submitted.');await update(ref(db,`roomsV2/${room}`),{[`players/${uid}/decisions/${r}`]:{alloc,spent:total},tradeClosed:true});draft={};toast('Cabinet allocation submitted.')}catch(e){toast('Submission failed: '+e.message)}}
async function sendOffer(){let to=document.getElementById('tradeTarget').value,credits=Number(document.getElementById('tradeMoney').value);if(tradeLocked())return toast('Trading closes as soon as any team locks their strategy.');if(!to||to===uid||!game.players[to])return toast('Select a valid partner.');if(credits>me.stats.treasury-draftTotal())return toast('Insufficient unallocated credits to offer.');if(!(credits>=5&&credits<=20))return;try{let id=uid.slice(0,7)+'_'+Date.now().toString(36);await set(ref(db,`roomsV2/${room}/offers/${id}`),{from:uid,to,credits,round:chosen(),status:'pending',created:Date.now()});toast('Offer sent.')}catch(e){toast(e.message)}}
async function respondOffer(id,status){if(tradeLocked())return toast('Trading is closed: a strategy has been locked.');try{await runTransaction(ref(db,`roomsV2/${room}/offers/${id}`),o=>o&&o.to===uid&&o.status==='pending'&&o.round===chosen()?{...o,status}:undefined,{applyLocally:false});toast('Offer '+status+'.')}catch(e){toast(e.message)}}
function nextRound(){draft={};runTransaction(ref(db,`roomsV2/${room}`),g=>g&&g.host===uid&&g.phase==='results'?{...g,phase:g.round===5?'finished':'decision',round:Math.min(5,g.round+1),tradeClosed:false}:undefined)}
function hash01(str){let x=2166136261;for(let i=0;i<str.length;i++)x=Math.imul(x^str.charCodeAt(i),16777619);return ((x>>>0)%10000)/10000}function mature(s,assets,r){let x={growth:0,inflation:0,budget:0,happiness:0,trade:0};let active=(k)=>Number(assets[k]||0);x.growth+=active('infrastructure')*.065+active('skills')*.038+active('innovation')*.043;x.trade+=active('trade')*.08+active('diplomacy')*.07;x.budget+=active('fiscal')*.055;x.happiness+=active('welfare')*.07+active('skills')*.045;x.inflation-=active('efficiency')*.04;if(r===2){x.inflation-=active('renewable')*.09+active('efficiency')*.07}if(r===3){x.trade+=active('domestic')*.12+active('diplomacy')*.08}if(r===5){x.growth+=active('climate')*.07+active('renewable')*.06+active('domestic')*.05;x.happiness+=active('climate')*.1}return x}
function compute(p,decision,r,offers,seed,id){let before=p.stats,assets={...(p.assets||{})},next={...before},event=worlds[r-1],base=event.impact,delta={growth:0,inflation:0,budget:0,happiness:0,trade:0},sp=0;for(let [k,v] of Object.entries(decision?.alloc||{})){let policy=event.policies.find(x=>x[0]===k);if(!policy)continue;let credit=Math.max(0,Math.floor(Number(v)||0));sp+=credit;let units=credit/10;for(let m of K)delta[m]+=Number(policy[3][m]||0)*units;if(policy[4]&&['renewable','domestic','infrastructure','skills','innovation','climate','efficiency','trade','diplomacy','fiscal','welfare'].includes(policy[4]))assets[policy[4]]=(assets[policy[4]]||0)+credit}sp=Math.min(sp,Math.max(0,Math.floor(before.treasury)));let income=Math.round(14+Math.max(0,before.growth)*.6+before.trade*.065);let tr=0;for(let o of offers){if(o.status!=='accepted'&&o.status!=='settled')continue;if(o.from===id)tr-=Number(o.credits);if(o.to===id)tr+=Number(o.credits);if(o.from===id||o.to===id){let bonus=tradeBonus(game?.players?.[o.from],game?.players?.[o.to],Number(o.credits));delta.trade+=o.from===id?bonus.sender:bonus.receiver}}let delayed=mature(before,assets,r);let uncertainty=round((hash01(seed+'/'+r+'/'+id)-.5)*2.4);for(let k of K){next[k]=Number(before[k])+Number(base[k]||0)+delta[k]+delayed[k]}next.growth+=uncertainty;next.happiness+=uncertainty*.8;next.growth=round(clamp(next.growth,-10,18));next.inflation=round(clamp(next.inflation,-2,22));for(let k of ['budget','happiness','trade'])next[k]=round(clamp(next[k],0,100));next.treasury=round(Math.max(0,before.treasury-sp+income+tr));let difference=Object.fromEntries(K.map(k=>[k,round(next[k]-before[k])]));return {stats:next,assets,history:{priorStats:before,priorAssets:p.assets||{},allocation:decision?.alloc||{},before:pts(before),score:pts(next),delta:difference,spent:sp,tradeCredits:tr,uncertainty,note:`Government spent ${sp} credits, collected ${income} in receipts and faced a ${uncertainty>=0?'favourable':'adverse'} uncertainty adjustment. Growth ${difference.growth>=0?'+':''}${difference.growth}pp; happiness ${difference.happiness>=0?'+':''}${difference.happiness} points.`}}}
async function resolveRound(){if(role!=='host')return;try{let result=await runTransaction(ref(db,`roomsV2/${room}`),g=>{if(!g||g.host!==uid||g.phase!=='decision')return;let r=g.round,offers=Object.values(g.offers||{}).filter(x=>x.round===r&&x.status==='accepted');let available=Object.fromEntries(Object.entries(g.players||{}).map(([id,p])=>[id,Math.max(0,Number(p.stats.treasury)-(Number(p.decisions?.[r]?.spent)||0))]));offers=offers.filter(o=>{let c=Number(o.credits)||0;if(available[o.from]>=c){available[o.from]-=c;available[o.to]=(available[o.to]||0)+c;return true}return false});for(let [id,p] of Object.entries(g.players||{})){let d=p.decisions?.[r],x=compute(p,d,r,offers,room,id);p.stats=x.stats;p.assets=x.assets;p.history=p.history||{};p.history[r]=x.history}for(let [oid,o] of Object.entries(g.offers||{})){if(o.round===r&&o.status==='accepted')o.status=offers.includes(o)?'settled':'failed_insufficient_funds'}g.phase='results';g.lastSummary=`Round ${r}: ${worlds[r-1].title}. ${Object.values(g.players||{}).filter(p=>p.decisions?.[r]).length} of ${Object.keys(g.players||{}).length} teams submitted. ${offers.length} accepted trade offers. Revenue, shocks and delayed investments applied.`;return g},{applyLocally:false});if(!result.committed)toast('This round was already resolved.')}catch(e){toast(e.message)}}
try{let app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;let s;try{s=JSON.parse(localStorage.getItem('ewV2Session')||'null')}catch(e){}if(s){room=s.room;role=s.role;listen()}else home()});signInAnonymously(auth).catch(e=>appEl.innerHTML=`<div class="panel danger">Firebase sign-in failed: ${esc(e.message)}. Enable Anonymous Authentication.</div>`)}catch(e){appEl.innerHTML=`<div class="panel danger">${esc(e.message)}</div>`}
</script></body></html>
