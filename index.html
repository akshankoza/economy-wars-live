-weight:700;max-width:90vw}.hidden{display:none}.badge-round{background:#233d60;color:#bbd7ff;padding:7px 12px;border-radius:9px;font-size:12px}.footer{text-align:center;margin-top:50px;color:#617e9d;font-size:12px}@media(max-width:850px){.c8,.c6,.c4{grid-column:span 12}.wrap{padding:15px 12px 45px}.panel{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:22px}h2{font-size:24px}.brand{font-size:17px}.rank td,.rank th{font-size:11px}}

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){let n=document.getElementById('toast');n.textContent=t;n.classList.remove('hidden');setTimeout(()=>n.classList.add('hidden'),4200)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function round(v){return Math.round(v*10)/10}function startStats(){return {growth:5,inflation:4,budget:65,happiness:65,trade:50,treasury:100}}function pts(s){return Math.round(8*s.growth+.8*s.budget+1.2*s.happiness+.8*s.trade-6*Math.abs(s.inflation-3))}function entries(){return Object.entries(game?.players||{})}function phase(){return game?.phase}function chosen(){return game?.round||0}function b(v){return Number(v||0).toFixed(1)}function textNum(v){return Number(v||0)}function draftTotal(){return Object.values(draft).reduce((n,v)=>n+Number(v||0),0)}function rn(){return worlds[chosen()-1]}
function home(){appEl.innerHTML=`<div class="hero"><div class="micro">WELCOME TO THE WORLD ENGINE</div><h1>RULE THE ECONOMY.<br><span class="good">SURVIVE THE WORLD.</span></h1><p class="sub">A multiplayer economics strategy arena. Allocate scarce resources, make deals with other nations, survive crises and pursue a secret national mission. Every decision has a cost. Every round changes the future.</p></div><div class="grid"><div class="panel c6"><div class="micro">FOR ORGANISERS</div><h2>Mission control</h2><p class="sub">Launch a world, control five economic rounds and project live rankings and outcomes.</p><label class="field">Event name<input id="hostName" placeholder="ArthaNiti Economics Club" maxlength="45"></label><button class="action" id="create">Create live arena ↗</button></div><div class="panel c6"><div class="micro">FOR STUDENTS</div><h2>Enter the world</h2><p class="sub">Join with a room code on your laptop. Become a country's cabinet.</p><label class="field">Room code<input id="code" placeholder="AB12CD" maxlength="6"></label><label class="field">Country / team name<input id="team" placeholder="Republic of Nova" maxlength="30"></label><button class="action gold" id="join">Join the competition ↗</button></div></div>`;document.getElementById('create').onclick=create;document.getElementById('join').onclick=join}
const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function roomCode(){return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
async function create(){let name=document.getElementById('hostName').value.trim()||'ArthaNiti Economics Club';try{let c=roomCode();await set(ref(db,`roomsV2/${c}`),{host:uid,hostName:name,phase:'lobby',round:0,created:Date.now(),players:{},offers:{}});room=c;role='host';saveSession();listen()}catch(e){toast(e.message)}}
async function join(){let code=document.getElementById('code').value.trim().toUpperCase(),name=document.getElementById('team').value.trim();if(!/^[A-Z2-9]{6}$/.test(code)||name.length<2)return toast('Enter a valid room code and name.');try{let r=await get(ref(db,`roomsV2/${code}`));if(!r.exists())return toast('Room not found.');let g=r.val();if(g.phase!=='lobby')return toast('The arena has already started.');if(Object.values(g.players||{}).some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('This country name is taken.');if(Object.keys(g.players||{}).length>=60)return toast('The arena is full.');let m=Object.keys(g.players||{}).length%missions.length;await set(ref(db,`roomsV2/${code}/players/${uid}`),{name,stats:startStats(),mission:m,decisions:{},history:{},joined:Date.now()});room=code;role='player';saveSession();listen()}catch(e){toast(e.message)}}
function saveSession(){localStorage.setItem('ewV2Session',JSON.stringify({room,role}))}function leave(){if(unsub)unsub();unsub=null;localStorage.removeItem('ewV2Session');game=null;room=null;role=null;me=null;draft={};home()}function listen(){if(unsub)unsub();unsub=onValue(ref(db,`roomsV2/${room}`),snap=>{if(!snap.exists()){leave();return}game=snap.val();if(role==='host'&&game.host!==uid)return leave();me=game.players?.[uid];if(role==='player'&&!me)return leave();render()},err=>toast(err.message))}
function topbar(){return `<div class="row between" style="margin-bottom:20px"><div><div class="micro">ARENA ${esc(room)} · ROUND ${chosen()} / 5</div><h2>${esc(game.hostName)}</h2></div><div class="row"><span class="pill">${entries().length} NATIONS</span><span class="pill">${esc(phase()).toUpperCase()}</span><button class="action alt" id="leave">Exit</button></div></div>`}
function leader(){let a=entries().map(([id,p])=>({id,...p,points:pts(p.stats)+(phase()==='finished'&&missions[p.mission||0][2](p.stats)?25:0)})).sort((a,b)=>b.points-a.points);return `<table class="rank"><thead><tr><th>Rank</th><th>Country</th><th>Prosperity</th><th>Growth</th><th>Wellbeing</th><th>Treasury</th></tr></thead><tbody>${a.map((p,i)=>`<tr><td>${i===0?'👑 ':''}#${i+1}</td><td><b>${esc(p.name)}</b></td><td>${p.points}</td><td>${b(p.stats.growth)}%</td><td>${b(p.stats.happiness)}</td><td>${b(p.stats.treasury)}</td></tr>`).join('')}</tbody></table>`}
function status(s){return `<div class="stats">${[['GDP growth',b(s.growth)+'%'],['Inflation',b(s.inflation)+'%'],['Fiscal strength',b(s.budget)],['Public happiness',b(s.happiness)],['Trade strength',b(s.trade)],['Treasury',b(s.treasury)+' cr'],['Prosperity',pts(s)]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div>`}
function eventCard(){return `<div class="event"><div class="micro">⚡ WORLD EVENT // ROUND ${chosen()}</div><h2>${esc(rn().title)}</h2><p class="sub">${esc(rn().desc)}</p></div>`}
function history(p){let h=p.history||{},keys=Object.keys(h).sort((a,b)=>a-b);if(!keys.length)return '<p class="sub">Your decisions will appear after the first results.</p>';return keys.map(k=>{let x=h[k],d=x.delta||{};return `<div class="log"><div class="row between"><b>Round ${k}: ${esc(worlds[k-1].label)}</b><b>${x.before} → ${x.score} points</b></div><div class="tiny">Spent ${x.spent} credits · Shock ${x.uncertainty>0?'+':''}${b(x.uncertainty)} · Trade ${x.tradeCredits>=0?'+':''}${x.tradeCredits||0} credits</div><div class="tiny">${['growth','inflation','budget','happiness','trade'].map(v=>`${v}: ${d[v]>=0?'+':''}${b(d[v])}`).join(' · ')}</div></div>`}).join('')}

function tradeUI(){let offers=currentOffers();return `<div class="panel c6"><div class="micro">DIPLOMATIC CHANNEL</div><h2>Trade & negotiate</h2><p class="sub">Offer a treasury transfer to another country. If accepted before resolution, both nations gain +1 trade strength per 5 credits transferred. Money moves from sender to receiver.</p>${phase()==='decision'&&!me.decisions?.[chosen()]?`<label class="field">Trading partner<select id="tradeTarget"><option value="">Choose a nation</option>${entries().filter(([id])=>id!==uid).map(([id,p])=>`<option value="${esc(id)}">${esc(p.name)}</option>`).join('')}</select></label><label class="field">Credits offered (5–20)<select id="tradeMoney">${[5,10,15,20].map(v=>`<option value="${v}">${v} credits</option>`).join('')}</select></label><button class="action alt" id="offer">Send trade offer ↗</button>`:'<p class="tiny">You may send offers while your cabinet decision is open.</p>'}<div style="margin-top:12px">${offers.filter(([,o])=>o.from===uid||o.to===uid).map(([id,o])=>{let other=game.players?.[o.from===uid?o.to:o.from]?.name||'Unknown';return `<div class="offer"><b>${o.from===uid?'Sent to':'Received from'} ${esc(other)}</b><p class="tiny">${o.credits} credits · ${esc(o.status||'pending')}</p>${o.to===uid&&o.status==='pending'&&phase()==='decision'?`<button class="action" data-accept="${esc(id)}">Accept offer</button> <button class="action alt" data-decline="${esc(id)}">Decline</button>`:''}</div>`}).join('')||'<div class="tiny">No negotiations yet.</div>'}</div></div>`}
function cabinet(){let r=chosen(),locked=me.decisions?.[r];if(locked){return `<div class="panel c8"><div class="micro">CABINET DECISION LOCKED</div><h2>Await the global outcome</h2><p class="sub">Allocation submitted: ${esc(Object.entries(locked.alloc||{}).filter(([,v])=>v).map(([id,v])=>`${rn().policies.find(x=>x[0]===id)?.[1]||id} ${v} cr`).join(' · ')||'Hold reserves')}.</p><div class="note">Your treasury will be charged after the host reveals the results. You can still accept incoming trade offers until the round closes.</div></div>`}
let total=draftTotal(),maximum=Math.min(60,Math.floor(me.stats.treasury));return `<div class="panel c8"><div class="row between"><div><div class="micro">THE CABINET ROOM</div><h2>Allocate your national budget</h2></div><span class="pill">MULTI-POLICY STRATEGY</span></div><p class="sub">Assign 0–30 credits per policy, in increments of 5. You may fund several policies. Every five credits unlocks one policy unit. Unspent treasury carries forward, and future tax receipts replenish it.</p><div class="note"><div class="row between"><b>Allocated budget</b><b id="budget-total" class="${total>maximum?'danger':'good'}">${total} / ${maximum} credits</b></div><div class="bar" style="margin:10px 0"><i id="budget-progress" style="width:${Math.min(100,maximum?total/maximum*100:0)}%"></i></div><div class="tiny" id="budget-remaining">Treasury now ${b(me.stats.treasury)} cr · Limit per round 60 cr · Expected remaining ${b(me.stats.treasury-total)} cr</div></div>${rn().policies.map(([id,label,description,delta,tag])=>`<div class="policy"><div class="sliderrow"><b>${esc(label)}</b><span class="spend" id="amount-${id}">${draft[id]||0} cr</span></div><p>${esc(description)} · ${esc(tag)}</p><input class="slider" data-slider="${id}" type="range" min="0" max="30" step="5" value="${draft[id]||0}"></div>`).join('')}<div class="row"><button id="commit" class="action" ${total>maximum?'disabled':''}>Lock in economic strategy ↗</button><span class="tiny">No changes after submission. Hold reserves by submitting 0 credits.</span></div></div>`}
function render(){if(!game)return;let body=topbar();if(role==='host'){let n=entries().length,done=entries().filter(([,p])=>p.decisions?.[chosen()]).length;body+=`<div class="grid"><div class="panel c8"><div class="micro">MISSION CONTROL</div><h2>${phase()==='lobby'?'The world is assembling':phase()==='finished'?'The world has a champion':`ROUND ${chosen()} · ${rn().label}`}</h2>${phase()==='lobby'?`<p class="sub">Project this room code. Teams join from their own laptops. Each team receives a secret mission.</p><div class="code">${room}</div><p class="tiny">${n}/60 nations joined</p><button class="action" id="start" ${n<2?'disabled':''}>Launch world simulation ↗</button>`:phase()==='decision'?`${eventCard()}<p class="sub">${done} of ${n} teams have submitted. Trade negotiations remain open until you resolve the round.</p><div class="bar"><i style="width:${n?100*done/n:0}%"></i></div><p><button class="action gold" id="resolve">Resolve economic round ↗</button></p><p class="tiny">For fair play, announce a consistent time limit externally. Resolving early applies the crisis even to countries that have not submitted.</p>`:phase()==='results'?`<p class="sub">Policies, negotiations, delayed effects and shocks have been applied.</p><div class="note">${esc(game.lastSummary||'Results published.')}</div><p><button class="action" id="next">${chosen()===5?'Crown the champions ↗':'Launch next round ↗'}</button></p>`:`<p class="sub">Review how economic trade-offs shaped the final world.</p><button class="action alt" id="reset">Exit arena</button>`}</div><div class="panel c4"><div class="micro">WORLD STATUS</div><h3>Live operations</h3><div class="kpi"><span>Connected nations</span><b>${n}</b></div><div class="kpi"><span>Round</span><b>${chosen()} / 5</b></div><div class="kpi"><span>Submitted</span><b>${phase()==='decision'?done+'/'+n:'—'}</b></div><div class="kpi"><span>Trade offers</span><b>${currentOffers().length}</b></div><div class="note">The rankings and changes update live. Only use the host device to advance rounds.</div></div><div class="panel c12"><h2>🏆 Live global rankings</h2>${leader()}</div><div class="panel c12"><h3>📡 Global economic bulletin</h3>${entries().map(([,p])=>`<div class="log"><b>${esc(p.name)}</b> · ${p.history?.[chosen()]?esc(p.history[chosen()].note):'No current outcome'}</div>`).join('')}</div></div>`}else{body+=`<div class="grid"><div class="panel c12"><div class="row between"><div><div class="micro">YOUR NATION</div><h2>🌐 ${esc(me.name)}</h2></div><span class="pill">${phase()==='lobby'?'Awaiting host':`Round ${chosen()} / 5`}</span></div>${status(me.stats)}<p class="note">🎯 <b>Your national mission: ${esc(missions[me.mission||0][0])}</b> — ${esc(missions[me.mission||0][1])} Completing it adds 25 bonus points at the end. Keep your objective private.</p></div>`;if(phase()==='lobby')body+=`<div class="panel c12"><h2>Nation registered</h2><p class="sub">Wait for the host to open the world economy.</p></div>`;else if(phase()==='decision')body+=`<div class="c12">${eventCard()}</div>${cabinet()}${tradeUI()}`;else if(phase()==='results')body+=`<div class="panel c12"><div class="micro">POST-CRISIS INTELLIGENCE</div><h2>Round ${chosen()} outcomes</h2><p class="sub">${esc(me.history?.[chosen()]?.note||'Your economic indicators have updated.')}</p>${history(me)}</div>`;else body+=`<div class="panel c12"><div class="micro">FINAL NATIONAL REPORT</div><h2>${esc(me.name)} · ${pts(me.stats)+(missions[me.mission||0][2](me.stats)?25:0)} total points</h2><div class="note">Base prosperity ${pts(me.stats)} + mission ${missions[me.mission||0][2](me.stats)?25:0} / 25 bonus.</div>${history(me)}</div>`;body+=`<div class="panel c12"><h2>🏆 Live world rankings ${phase()==='finished'?'(including mission bonuses)':''}</h2>${leader()}</div></div>`}appEl.innerHTML=body;document.getElementById('leave')?.addEventListener('click',leave);document.getElementById('reset')?.addEventListener('click',leave);document.getElementById('start')?.addEventListener('click',()=>runTransaction(ref(db,`roomsV2/${room}`),v=>v&&v.host===uid&&v.phase==='lobby'?{...v,phase:'decision',round:1}:undefined));document.getElementById('next')?.addEventListener('click',nextRound);document.getElementById('resolve')?.addEventListener('click',resolveRound);document.querySelectorAll('[data-slider]').forEach(el=>el.addEventListener('input',()=>{draft[el.dataset.slider]=Number(el.value);let t=draftTotal(),limit=Math.min(60,Math.floor(me.stats.treasury));document.getElementById('amount-'+el.dataset.slider).textContent=el.value+' cr';let note=document.querySelector('#commit');note.disabled=t>limit;let summary=document.getElementById('budget-total');if(summary){summary.textContent=t+' / '+limit+' credits';summary.className=t>limit?'danger':'good';}let bar=document.getElementById('budget-progress');if(bar)bar.style.width=Math.min(100,limit?t/limit*100:0)+'%';let left=document.getElementById('budget-remaining');if(left)left.textContent='Treasury now '+b(me.stats.treasury)+' cr · Limit per round 60 cr · Expected remaining '+b(me.stats.treasury-t)+' cr';}));document.getElementById('commit')?.addEventListener('click',submit);document.getElementById('offer')?.addEventListener('click',sendOffer);document.querySelectorAll('[data-accept]').forEach(el=>el.onclick=()=>respondOffer(el.dataset.accept,'accepted'));document.querySelectorAll('[data-decline]').forEach(el=>el.onclick=()=>respondOffer(el.dataset.decline,'declined'))}
async function submit(){let total=draftTotal(),limit=Math.min(60,Math.floor(me.stats.treasury)),alloc={};if(total>limit||total<0)return toast('Allocation exceeds your budget.');for(let p of rn().policies){let v=Number(draft[p[0]]||0);if(v<0||v>30||v%5!==0)return toast('Invalid policy allocation.');if(v)alloc[p[0]]=v;}let r=chosen();toast('Submitting strategy to Firebase…');try{let result=await runTransaction(ref(db,`roomsV2/${room}/players/${uid}/decisions/${r}`),x=>x===null?{alloc,spent:total}:undefined,{applyLocally:false});if(!result.committed)return toast('Decision was already submitted.');draft={};toast('Cabinet allocation submitted.')}catch(e){toast('Submission failed: '+e.message)}}
async function sendOffer(){let to=document.getElementById('tradeTarget').value,credits=Number(document.getElementById('tradeMoney').value);if(!to||to===uid||!game.players[to])return toast('Select a valid partner.');if(!(credits>=5&&credits<=20))return;try{let id=uid.slice(0,7)+'_'+Date.now().toString(36);await set(ref(db,`roomsV2/${room}/offers/${id}`),{from:uid,to,credits,round:chosen(),status:'pending',created:Date.now()});toast('Offer sent.')}catch(e){toast(e.message)}}
async function respondOffer(id,status){try{await runTransaction(ref(db,`roomsV2/${room}/offers/${id}`),o=>o&&o.to===uid&&o.status==='pending'&&o.round===chosen()?{...o,status}:undefined,{applyLocally:false});toast('Offer '+status+'.')}catch(e){toast(e.message)}}
function nextRound(){draft={};runTransaction(ref(db,`roomsV2/${room}`),g=>g&&g.host===uid&&g.phase==='results'?{...g,phase:g.round===5?'finished':'decision',round:Math.min(5,g.round+1)}:undefined)}
function hash01(str){let x=2166136261;for(let i=0;i<str.length;i++)x=Math.imul(x^str.charCodeAt(i),16777619);return ((x>>>0)%10000)/10000}function mature(s,assets,r){let x={growth:0,inflation:0,budget:0,happiness:0,trade:0};let active=(k)=>Number(assets[k]||0);x.growth+=active('infrastructure')*.065+active('skills')*.038+active('innovation')*.043;x.trade+=active('trade')*.08+active('diplomacy')*.07;x.budget+=active('fiscal')*.055;x.happiness+=active('welfare')*.07+active('skills')*.045;x.inflation-=active('efficiency')*.04;if(r===2){x.inflation-=active('renewable')*.09+active('efficiency')*.07}if(r===3){x.trade+=active('domestic')*.12+active('diplomacy')*.08}if(r===5){x.growth+=active('climate')*.07+active('renewable')*.06+active('domestic')*.05;x.happiness+=active('climate')*.1}return x}
function compute(p,decision,r,offers,seed,id){let before=p.stats,assets={...(p.assets||{})},next={...before},event=worlds[r-1],base=event.impact,delta={growth:0,inflation:0,budget:0,happiness:0,trade:0},sp=0;for(let [k,v] of Object.entries(decision?.alloc||{})){let policy=event.policies.find(x=>x[0]===k);if(!policy)continue;let credit=Math.min(30,Math.max(0,Number(v)||0));sp+=credit;let units=credit/10;for(let m of K)delta[m]+=Number(policy[3][m]||0)*units;if(policy[4]&&['renewable','domestic','infrastructure','skills','innovation','climate','efficiency','trade','diplomacy','fiscal','welfare'].includes(policy[4]))assets[policy[4]]=(assets[policy[4]]||0)+credit}sp=Math.min(sp,60,Math.max(0,Math.floor(before.treasury)));let income=Math.round(14+Math.max(0,before.growth)*.6+before.trade*.065);let tr=0;for(let o of offers){if(o.status!=='accepted')continue;if(o.from===id)tr-=Number(o.credits);if(o.to===id)tr+=Number(o.credits);if(o.from===id||o.to===id)delta.trade+=Math.floor(Number(o.credits)/5)*1}let delayed=mature(before,assets,r);let uncertainty=round((hash01(seed+'/'+r+'/'+id)-.5)*2.4);for(let k of K){next[k]=Number(before[k])+Number(base[k]||0)+delta[k]+delayed[k]}next.growth+=uncertainty;next.happiness+=uncertainty*.8;next.growth=round(clamp(next.growth,-10,18));next.inflation=round(clamp(next.inflation,-2,22));for(let k of ['budget','happiness','trade'])next[k]=round(clamp(next[k],0,100));next.treasury=round(clamp(before.treasury-sp+income+tr,0,250));let difference=Object.fromEntries(K.map(k=>[k,round(next[k]-before[k])]));return {stats:next,assets,history:{before:pts(before),score:pts(next),delta:difference,spent:sp,tradeCredits:tr,uncertainty,note:`Government spent ${sp} credits, collected ${income} in receipts and faced a ${uncertainty>=0?'favourable':'adverse'} uncertainty adjustment. Growth ${difference.growth>=0?'+':''}${difference.growth}pp; happiness ${difference.happiness>=0?'+':''}${difference.happiness} points.`}}}
async function resolveRound(){if(role!=='host')return;try{let result=await runTransaction(ref(db,`roomsV2/${room}`),g=>{if(!g||g.host!==uid||g.phase!=='decision')return;let r=g.round,offers=Object.values(g.offers||{}).filter(x=>x.round===r&&x.status==='accepted');for(let [id,p] of Object.entries(g.players||{})){let d=p.decisions?.[r],x=compute(p,d,r,offers,room,id);p.stats=x.stats;p.assets=x.assets;p.history=p.history||{};p.history[r]=x.history}g.phase='results';g.lastSummary=`Round ${r}: ${worlds[r-1].title}. ${Object.values(g.players||{}).filter(p=>p.decisions?.[r]).length} of ${Object.keys(g.players||{}).length} teams submitted. ${offers.length} accepted trade offers. Revenue, shocks and delayed investments applied.`;return g},{applyLocally:false});if(!result.committed)toast('This round was already resolved.')}catch(e){toast(e.message)}}
try{let app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app);onAuthStateChanged(auth,u=>{if(!u)return;uid=u.uid;let s;try{s=JSON.parse(localStorage.getItem('ewV2Session')||'null')}catch(e){}if(s){room=s.room;role=s.role;listen()}else home()});signInAnonymously(auth).catch(e=>appEl.innerHTML=`<div class="panel danger">Firebase sign-in failed: ${esc(e.message)}. Enable Anonymous Authentication.</div>`)}catch(e){appEl.innerHTML=`<div class="panel danger">${esc(e.message)}</div>`}
</script></body></html>
