let db,auth,uid,pid,room='',role='',game=null,me=null,off=null,selected='IN',alloc={},marketTab='market',resultTab='reaction',tradeKind='energy',tradeQty=10,tradePrice=10,target='public',recentPopupRound='',tradeForm={resource:'energy',qty:'10',price:'10',to:'public'};const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const nice=v=>Number(v||0).toFixed(1),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));const phase=()=>game?.phase||'lobby',round=()=>Number(game?.round||0),players=()=>Object.entries(game?.players||{}),country=p=>N.find(n=>n[0]===p?.country)||N[0],crisis=()=>WORLD[round()-1],sum=o=>Object.values(o||{}).reduce((a,v)=>a+Number(v||0),0),codes='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';function note(t){let e=$('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),4200)}function tx(fn){return runTransaction(ref(db,'nationWars/'+room),fn,{applyLocally:false})}function initStats(n){return{growth:5+(n[4]-2)*.4,inflation:4,fiscal:65,happy:65,trade:50,treasury:100,energy:n[5],supplies:n[6]}}function pts(s){let growth=clamp((s.growth+2)/14*100,0,100),infl=clamp(100-13*Math.abs(s.inflation-3),0,100),res=clamp((Number(s.energy)+Number(s.supplies))/1.5,0,100);return Math.round(.20*growth+.20*infl+.20*s.happy+.15*s.fiscal+.15*s.trade+.10*res)}function nationalMission(p){return MISSIONS[p.mission||0]||MISSIONS[0]}function login(){let claims=new Set(players().map(([,p])=>p.country));$('app').innerHTML=`<section class="hero"><div class="over">ARTHANITI PRESENTS · A REAL-TIME STRATEGY CHAMPIONSHIP</div><h1>RULE YOUR NATION.<br><span class="good">SURVIVE THE WORLD.</span></h1><p class="dim">Five crises. Twelve competing nations. One shared resource market. Every credit has a cost—and every decision shapes tomorrow.</p></section><div class="joincols"><section class="panel stack"><div class="over">FOR THE ORGANISER</div><h2>Mission control</h2><p class="note">Create a live room, control the market and reveal economic results.</p><label class="field">Event name<input id="event" maxlength="40" value="ArthaNiti Nation Wars"></label><button class="btn" id="create">Create arena →</button></section><section class="panel stack"><div class="over">FOR PARTICIPANTS</div><h2>Choose your nation</h2><div class="row"><label class="field" style="flex:1">Room code<input id="joincode" placeholder="ABC123" maxlength="6"></label></div><div id="nations" class="nationgrid">${N.map(n=>`<button class="nation ${selected===n[0]?'selected':''}" data-country="${n[0]}"><b>${n[1]}</b>${esc(n[2])}<br><small>${esc(n[7])}</small></button>`).join('')}</div><p class="tiny" id="claim-status">Enter a six-character room code to see available countries.</p><button class="btn warn" id="join">Claim nation & join →</button></section></div>`;$('create').onclick=create;$('join').onclick=join;$('joincode').oninput=refreshCountryAvailability;$('nations').onclick=e=>{let b=e.target.closest('[data-country]');if(b&&!b.disabled){selected=b.dataset.country;[...$('nations').children].forEach(x=>x.classList.toggle('selected',x===b))}}}
let claimCheckSeq=0;
async function refreshCountryAvailability(){
 const code=($('joincode')?.value||'').trim().toUpperCase();
 const seq=++claimCheckSeq;
 const buttons=[...document.querySelectorAll('[data-country]')];
 if(!/^[A-Z2-9]{6}$/.test(code)){
   buttons.forEach(b=>{b.disabled=false;b.title='';b.classList.toggle('selected',b.dataset.country===selected)});
   if($('claim-status'))$('claim-status').textContent='Enter a six-character room code to see available countries.';
   return;
 }
 try{
   const snap=await get(ref(db,'nationWars/'+code));
   if(seq!==claimCheckSeq||$('joincode')?.value.trim().toUpperCase()!==code)return;
   if(!snap.exists()){
     if($('claim-status'))$('claim-status').textContent='Room not found. Check the code with your host.';
     buttons.forEach(b=>b.disabled=false);
     return;
   }
   const data=snap.val();
   const used=new Set(Object.values(data.players||{}).map(p=>p.country));
   buttons.forEach(b=>{const booked=used.has(b.dataset.country);b.disabled=booked;b.title=booked?'Already claimed in this arena':'';b.classList.toggle('selected',b.dataset.country===selected&&!booked)});
   if(used.has(selected)){selected=buttons.find(b=>!b.disabled)?.dataset.country||'';buttons.forEach(b=>b.classList.toggle('selected',b.dataset.country===selected));}
   if($('claim-status'))$('claim-status').textContent=data.phase!=='lobby'?'This arena has already started.':'Available nations: '+(12-used.size)+' / 12';
 }catch(e){if(seq===claimCheckSeq&&$('claim-status'))$('claim-status').textContent='Could not check country availability: '+e.message;}
}

function nationStats(p){let s=p.stats;return `<div class="metrics">${[['GDP growth',nice(s.growth)+'%'],['Inflation',nice(s.inflation)+'%'],['Public wellbeing',nice(s.happy)],['Fiscal stability',nice(s.fiscal)],['Trade strength',nice(s.trade)],['Performance index',pts(s)+'/100']].map(([a,b])=>`<div class="metric"><small>${a}</small><b>${b}</b></div>`).join('')}</div><div class="resource"><span>💰 Treasury</span><b>${Math.floor(s.treasury)} cr</b></div><div class="resource"><span>⚡ Energy</span><b>${Math.floor(s.energy)}</b></div><div class="resource"><span>🏭 Supplies</span><b>${Math.floor(s.supplies)}</b></div>`}
function tradeOffers(){return Object.entries(game.offers||{}).filter(([,o])=>o.round===round()).sort((a,b)=>(b[1].created||0)-(a[1].created||0))}function visibleMarket(){return tradeOffers().filter(([,o])=>o.status==='open'&&(o.to==='public'||o.to===pid)&&o.from!==pid)}function visibleMine(){return tradeOffers().filter(([,o])=>o.from===pid||o.to===pid)}function statusOffer(o){return o.status==='filled'?'COMPLETED':o.status==='open'?'OPEN':o.status.toUpperCase()}function offerCard(id,o){let from=game.players?.[o.from],to=game.players?.[o.to];return `<article class="offer"><div class="row between"><b>${country(from)[1]} ${esc(country(from)[2])}</b><span class="pill ${o.status==='filled'?'':'gold'}">${statusOffer(o)}</span></div><div style="margin-top:4px">⚡${o.resource==='energy'?' Energy':'🏭 Industrial supplies'} · <b>${o.qty} units</b> for <b>${o.price} credits</b></div><div class="tiny">${o.to==='public'?'Public · first eligible buyer':`Private to ${esc(country(to)[2])}`}</div>${phase()==='market'&&o.status==='open'&&o.from!==pid&&(o.to==='public'||o.to===pid)?`<div class="row"><button class="btn sm" data-buy="${id}">Review / Accept</button><button class="btn alt sm" data-counter="${id}">Counteroffer</button></div>`:''}${phase()==='market'&&o.status==='open'&&o.from===pid?`<div class="row"><button class="btn alt sm" data-cancel="${id}">Withdraw offer</button></div>`:''}</article>`}
function market(){let locked=phase()!=='market';let content=marketTab==='market'?visibleMarket().map(([id,o])=>offerCard(id,o)).join('')||'<p class="tiny">No available offers yet. Publish yours to start trading.</p>':marketTab==='mine'?visibleMine().map(([id,o])=>offerCard(id,o)).join('')||'<p class="tiny">No trades or offers yet.</p>':marketTab==='log'?`<div class="compact-list">${Object.values(game.offers||{}).filter(o=>o.status==='filled').sort((a,b)=>(b.settled||0)-(a.settled||0)).map(o=>`<div class="offer"><b>${country(game.players?.[o.from])[2]} → ${country(game.players?.[o.buyer])[2]}</b><br>${o.qty} ${o.resource} for ${o.price} cr · Round ${o.round}</div>`).join('')||'<p class="tiny">No completed trades yet.</p>'}</div>`:'';return `<section class="panel"><div class="row between"><h3>🤝 Global Trade Exchange</h3><span class="pill ${locked?'red':''}">${locked?'CLOSED':'OPEN'}</span></div><div class="tabs"><button class="tab ${marketTab==='market'?'active':''}" data-tab="market">Market ${visibleMarket().length}</button><button class="tab ${marketTab==='mine'?'active':''}" data-tab="mine">My deals</button><button class="tab ${marketTab==='log'?'active':''}" data-tab="log">Trade log</button></div><div class="offers">${content}</div>${!locked?`<div class="line tradeform"><b style="font-size:12px">Create an offer</b><div class="row"><label class="field" style="flex:1">Sell<select id="resource"><option value="energy">⚡ Energy</option><option value="supplies">🏭 Industrial supplies</option></select></label><label class="field" style="width:68px">Units<input id="quantity" type="number" min="1" step="1" value="${esc(tradeForm.qty)}"></label><label class="field" style="width:68px">Credits<input id="price" type="number" min="1" step="1" value="${esc(tradeForm.price)}"></label></div><label class="field">Buyer<select id="recipient"><option value="public">🌍 Any country (public market)</option>${players().filter(([id])=>id!==pid).map(([id,p])=>`<option value="${id}">${country(p)[1]} ${esc(country(p)[2])}</option>`).join('')}</select></label><p class="tiny" id="tradepreview">Seller gives selected goods; buyer gives quoted credits. Settlement is immediate on acceptance.</p><button class="btn sm" id="publish">Publish offer</button></div>`:'<p class="tiny">Trading is closed. Completed transactions remain visible in the log.</p>'}<p class="tiny">Trades settle instantly. Sellers may post up to 10 active offers; unsold listings are not transfers.</p></section>`}
function playerPlay(){let n=country(me),s=me.stats,r=round(),decision=me.decisions?.[r],lim=Math.floor(s.treasury),tot=sum(alloc);return `<div class="play"><section class="panel"><div class="row between"><div><div class="over">YOUR NATION</div><h2>${n[1]} ${esc(n[2])}</h2></div><span class="pill">${n[4]===3?'LARGE':n[4]===1?'SMALL':'MID'} ECONOMY</span></div>${nationStats(me)}<div class="feature"><b>🎯 ${esc(nationalMission(me)[0])}</b><br>${esc(nationalMission(me)[1])}</div><p class="tiny">Strength: ${esc(n[7])}<br>Vulnerability: ${esc(n[8])}</p></section><section class="panel">${phase()==='lobby'?`<div class="over">NATION CLAIMED</div><h2>Welcome to your cabinet</h2><p class="note">You have exclusive control of ${esc(n[2])} in this arena. Other players can no longer select it.</p><div class="feature">Your mission is private. Wait for the host to launch Round 1.</div>`:phase()==='market'||phase()==='decision'?`<div class="row between"><div class="over">ROUND ${r} · ${esc(crisis().tag)}</div><span class="pill ${phase()==='market'?'gold':''}">${phase()==='market'?'NEGOTIATE':'DECIDE'}</span></div><div class="crisis"><div class="over" style="color:var(--gold)">⚡ GLOBAL CRISIS</div><h2>${esc(crisis().title)}</h2><p>${esc(crisis().desc)}</p></div><div class="row between"><b>Allocate whole-number credits</b><span class="tiny">No policy caps</span></div>${crisis().pol.map(([id,label,desc])=>`<label class="alloc"><span><strong>${esc(label)}</strong><small>${esc(desc)}</small></span><input class="num" type="number" min="0" step="1" max="${lim}" data-alloc="${id}" value="${alloc[id]||0}" ${phase()==='market'||decision?'disabled':''}></label>`).join('')}<div class="allocation-total"><span>Investment</span><span id="total" class="${tot>lim?'bad':'good'}">${tot} / ${lim} cr</span></div><div class="actionfoot"><span class="tiny" id="balance">${phase()==='market'?'Allocate after trading closes':decision?'Strategy locked':'Remaining treasury: '+(lim-tot)+' cr'}</span><button class="btn" id="lock" ${phase()!=='decision'||decision||tot>lim?'disabled':''}>${decision?'Locked ✓':'Lock Strategy →'}</button></div><p class="tiny">Cash from completed trades is immediately available for policy spending. Your national market closes for everyone at the host's deadline.</p>`:''}</section>${market()}</div>`}
function scoreboard(final=false){let all=players().map(([id,p])=>({id,p,n:country(p),score:Math.min(100,pts(p.stats)+(final&&nationalMission(p)[2](p.stats)?5:0))})).sort((a,b)=>b.score-a.score);return `<table class="scoreboard"><thead><tr><th>Rank</th><th>Nation</th><th>Performance</th><th>Mission</th></tr></thead><tbody>${all.map((a,i)=>`<tr><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</td><td><b>${a.n[1]} ${esc(a.n[2])}</b></td><td><b>${a.score}/100${final&&a.score>pts(a.p.stats)?' +5':''}</b></td><td>${final?nationalMission(a.p)[2](a.p.stats)?'✓ Success':'Not met':'Hidden'}</td></tr>`).join('')}</tbody></table>`}
function resultView(){let h=me.history?.[round()]||{},n=country(me),p=me,tab=resultTab,html='';if(tab==='reaction'){let x=h.delta||{},quip=x.fiscal< -4?'Our finance minister asked whether the treasury has a recovery plan.':x.growth>1?'Growth is up! Now explain the bill to the cabinet.':x.happy< -2?'The people request fewer graphs and better living standards.':'Our economists brought five charts and one very nervous forecast.';html=`<div class="panel stack"><div class="over">${n[1]} ${esc(n[2])} · FICTIONAL LEADER REACTION</div><h2>${esc(n[3])}</h2><div class="reason">“${esc(quip)}”</div><p class="note">This dialogue is invented for an educational game; it is not a statement or endorsement by a real leader.</p><p class="note">${esc(h.note||'Your economic results have been revealed.')}</p></div>`}else if(tab==='economy'){html=`<div class="panel stack"><div class="over">AFTER THE CRISIS</div><h2>National economic outcome</h2><div class="bigscore">${pts(p.stats)} / 100</div>${nationStats(p)}<p class="note">${esc(h.note||'Indicators updated based on policy, inventories and previous decisions.')}</p></div>`}else if(tab==='expert'){html=expertHTML(p,round())}else{html=`<div class="panel stack"><div class="over">WORLD PERFORMANCE INDEX</div><h2>${phase()==='finished'?'Final standings':'Round '+round()+' rankings'}</h2>${scoreboard(phase()==='finished')}<p class="tiny">Rankings are displayed only after host resolution. Final mission completion adds 5 points.</p></div>`}return `<div class="results"><div class="row between"><div><div class="over">ROUND ${round()} · INTELLIGENCE REPORT</div><h2>${esc(crisis().title)}</h2></div><span class="pill">RESULTS REVEALED</span></div><div class="resulttabs">${[['reaction','🎭 Leader reaction'],['economy','📊 Economy'],['expert','🎓 Expert academy'],['rankings','🏆 Rankings']].map(([id,label])=>`<button data-result="${id}" class="btn ${tab===id?'':'alt'}">${label}</button>`).join('')}</div>${html}</div>`}
function stateAfter(p,r,allocation){let event=WORLD[r-1],s={...p.stats},assets={...(p.assets||{})},d={growth:0,inflation:0,fiscal:0,happy:0,trade:0},spent=0;for(let [key,amount] of Object.entries(allocation||{})){let policy=event.pol.find(q=>q[0]===key);if(!policy)continue;let v=Math.max(0,Math.floor(Number(amount)||0));spent+=v;let multiplier=20*(1-Math.exp(-v/20))/10;for(let k of Object.keys(d))d[k]+=Number(policy[3][k]||0)*multiplier;assets[policy[4]]=(assets[policy[4]]||0)+v}for(let k of Object.keys(d))s[k]+=Number(event.shock[k]||0)+d[k];let energyNeed=r===2?45:r===5?38:20,industrialNeed=r===3?50:r===4?48:24;let eShort=Math.max(0,energyNeed-Number(s.energy));let iShort=Math.max(0,industrialNeed-Number(s.supplies));if(r===2){s.inflation+=eShort*.075;s.growth-=eShort*.038}if(r===3){s.growth-=iShort*.05;s.trade-=iShort*.06}if(r===4){s.growth-=iShort*.025}s.energy=Math.max(0,s.energy-(r===2?12:4));s.supplies=Math.max(0,s.supplies-(r===3?10:4));s.growth+=Number(assets.infra||0)*.006+Number(assets.export||0)*.003+Number(assets.ai||0)*.005;s.trade+=Number(assets.export||0)*.008+Number(assets.custom||0)*.005;s.happy+=Number(assets.social||0)*.006+Number(assets.worker||0)*.007;s.inflation-=Number(assets.eff||0)*.007;if(r===5){s.growth+=Number(assets.infra||0)*.004+Number(assets.adapt||0)*.01}s.treasury=Math.max(0,s.treasury-spent+Math.round(11+Math.max(0,s.growth)*.7+s.trade*.05));s.growth=clamp(s.growth,-10,18);s.inflation=clamp(s.inflation,-2,22);for(let k of ['fiscal','happy','trade'])s[k]=clamp(s[k],0,100);for(let k of ['growth','inflation','fiscal','happy','trade','treasury'])s[k]=Math.round(s[k]*10)/10;return{s,assets,spent,impact:d}}
function expertHTML(p,r){let h=p.history?.[r];if(!h?.before)return '<div class="panel">No round snapshot available.</div>';let ctx={...p,stats:h.before,assets:h.beforeAssets||{}},pol=WORLD[r-1].pol,keys=pol.map(x=>x[0]),limit=Math.floor(h.before.treasury),chosen=h.allocation||{};const evalA=a=>{let x=stateAfter(ctx,r,a),next=x.s;return{...x,obj:pts(next)+.06*next.treasury+(nationalMission(p)[2](next)?3:0)}};let best={};for(let k of keys)best[k]=0;let current=evalA(best);let stride=Math.max(1,Math.ceil(limit/120));let hops=0;while(hops++<200){let candidate=null;for(let key of keys){for(let take of [1,stride]){let a={...best,[key]:(best[key]||0)+take};if(sum(a)>limit)continue;let x=evalA(a);if(x.obj>current.obj+1e-7&&(!candidate||x.obj>candidate.x.obj))candidate={a,x}}}for(let from of keys)for(let to of keys)if(from!==to&&best[from]>0){let a={...best,[from]:best[from]-1,[to]:best[to]+1},x=evalA(a);if(x.obj>current.obj+1e-7&&(!candidate||x.obj>candidate.x.obj))candidate={a,x}}if(!candidate)break;best=candidate.a;current=candidate.x}let mine=evalA(chosen);return `<section class="panel stack"><div class="over">YOUR ECONOMIC ADVISOR · MODEL BENCHMARK</div><h2>Why allocate these credits?</h2><p class="tiny">A locally searched benchmark—not a guaranteed global optimum. It compares the same starting country and resource inventory.</p><table class="scoreboard"><thead><tr><th>Policy</th><th>You</th><th>Expert</th></tr></thead><tbody>${pol.map(x=>`<tr><td>${esc(x[1])}</td><td>${chosen[x[0]]||0}</td><td class="good"><b>${best[x[0]]||0}</b></td></tr>`).join('')}</tbody></table><p class="note">Your model score: <b>${pts(mine.s)}/100</b> · Expert benchmark: <b>${pts(current.s)}/100</b>. The benchmark also values leftover treasury and national mission progress.</p><div class="over">SPECIFIC ALLOCATION REASONS</div>${pol.map(x=>{let a=best[x[0]]||0,u={...best,[x[0]]:a+1},down={...best,[x[0]]:Math.max(0,a-1)},more=sum(u)<=limit?evalA(u).obj-current.obj:null,less=a>0?evalA(down).obj-current.obj:null;return `<div class="reason"><div class="reasonhead">${esc(x[1])} · ${a} credits</div><span class="tiny">${esc(x[2])}</span><br><b>1 more credit:</b> ${more===null?'Unavailable within the treasury cap.':(more>=0?'+':'')+nice(more)+' points in the expert objective.'}<br><b>1 fewer credit:</b> ${less===null?'Allocation already zero.':(less>=0?'+':'')+nice(less)+' points in the expert objective.'}<br>Consider this benefit against one credit kept in reserves or invested elsewhere.</div>`}).join('')}<div class="reason"><div class="reasonhead">🔎 THE OFTEN-MISSED FACTOR</div>${r===1?'Treasury flexibility matters when the next shock arrives. Immediate growth is not everything.':r===2?'Energy shortages multiply inflation damage; efficiency assets keep paying off beyond this round.':r===3?'Manufacturing depends on imported industrial supplies. Tariffs can backfire if critical inputs are scarce.':r===4?'Technology adoption benefits growth, but worker welfare and input availability determine resilience.':'Earlier reserves, resource trades and investments determine how well your economy survives.'}</div><div class="reason"><div class="reasonhead">🎓 HOW TO IMPROVE NEXT ROUND</div>Evaluate the *next* credit, not just the headline policy. Compare what you gain now with future flexibility, resource shortages and the effect on your national mission.</div></section>`}
function hostView(){let count=players().length,done=players().filter(([,p])=>p.decisions?.[round()]).length,action=phase()==='lobby'?['Start Round 1','start']:phase()==='market'?['Close market → Open decisions','close']:phase()==='decision'?['Resolve economic round','resolve']:phase()==='results'?['Reveal next phase','next']:['Tournament completed','none'];return `<div class="hostgrid"><section class="panel stack"><div class="over">MISSION CONTROL</div><h2>${phase()==='lobby'?'Your world is assembling':phase()==='finished'?'The champions are crowned':esc(crisis().title)}</h2><p class="note">${phase()==='lobby'?'Share the room code. Participants claim unique countries—no team name needed.':phase()==='market'?'International market is open. All completed trades settle immediately.':phase()==='decision'?'All trading is closed. Countries now lock their policy allocations.':phase()==='results'?'Everyone can study results, expert reasoning and the leaderboard.':'Final rankings include mission bonuses.'}</p><div class="panel" style="background:#081d2c"><span class="over">ROOM CODE</span><div style="font:800 43px 'Space Grotesk';color:var(--mint);letter-spacing:.1em">${room}</div></div><div class="row"><span class="pill">${count}/12 COUNTRIES</span><span class="pill">${done}/${count} SUBMITTED</span><span class="pill ${phase()==='market'?'':'red'}">TRADING ${phase()==='market'?'OPEN':'CLOSED'}</span></div><button class="btn" id="hostaction" ${action[1]==='none'||(phase()==='lobby'&&count<2)?'disabled':''}>${action[0]}</button><p class="tiny">Host controls each phase. Do not resolve until all teams have submitted, unless intentionally applying the zero-spending default to missing decisions.</p></section><section class="panel stack"><div class="over">LIVE COUNTRY STATUS</div>${players().map(([,p])=>`<div class="resource"><span>${country(p)[1]} ${country(p)[2]}</span><span>${p.decisions?.[round()]?'✓ Locked':phase()==='lobby'?'Joined':'Waiting'}</span></div>`).join('')}<div cla function render(){document.body.classList.toggle('game',role==='player'&&(phase()==='market'||phase()==='decision'));let body=heading();if(role==='host')body+=hostView();else if(phase()==='results'||phase()==='finished')body+=resultView();else body+=playerPlay();$('app').innerHTML=body; if($('resource'))$('resource').value=tradeForm.resource;if($('recipient')&&[...$('recipient').options].some(o=>o.value===tradeForm.to))$('recipient').value=tradeForm.to;for(const [key,id] of [['resource','resource'],['qty','quantity'],['price','price'],['to','recipient']]){const el=$(id);if(el)el.addEventListener('input',()=>{tradeForm[key]=el.value});} $('exit').onclick=leave;if(role==='host')$('hostaction')?.addEventListener('click',hostAction);document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{marketTab=e.dataset.tab;render()});document.querySelectorAll('[data-result]').forEach(e=>e.onclick=()=>{resultTab=e.dataset.result;render()});document.querySelectorAll('[data-alloc]').forEach(e=>e.oninput=()=>{alloc[e.dataset.alloc]=Math.max(0,Math.floor(Number(e.value)||0));let t=sum(alloc),lim=Math.floor(me.stats.treasury);$('total').textContent=t+' / '+lim+' cr';$('total').className=t>lim?'bad':'good';$('balance').textContent=t>lim?'Over budget by '+(t-lim):'Remaining treasury: '+(lim-t)+' cr';$('lock').disabled=t>lim});$('lock')?.addEventListener('click',lock);$('publish')?.addEventListener('click',publish);document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>buy(e.dataset.buy));document.querySelectorAll('[data-counter]').forEach(e=>e.onclick=()=>counter(e.dataset.counter));document.querySelectorAll('[data-cancel]').forEach(e=>e.onclick=()=>cancel(e.dataset.cancel))}
async function hostAction(){try{let p=phase(),r=round();let res=await tx(g=>{if(!g||g.host!==uid||g.phase!==p)return;if(p==='lobby'&&Object.keys(g.players||{}).length>=2){g.phase='market';g.round=1}else if(p==='market')g.phase='decision';else if(p==='decision'){for(let [id,person] of Object.entries(g.players||{})){let a=person.decisions?.[r]?.alloc||{},before={...person.stats},beforeAssets={...(person.assets||{})},x=stateAfter(person,r,a);person.stats=x.s;person.assets=x.assets;person.history=person.history||{};person.history[r]={before,beforeAssets,allocation:a,scoreBefore:pts(before),scoreAfter:pts(x.s),delta:{growth:x.s.growth-before.growth,fiscal:x.s.fiscal-before.fiscal,happy:x.s.happy-before.happy},note:`Spent ${x.spent} credits; received income and faced the round's crisis, resource shortages and delayed investments.`}}g.phase='results'}else if(p==='results'){if(r>=5)g.phase='finished';else{g.round=r+1;g.phase='market'}}else return;return g});if(!res.committed)note('Could not advance; check the current host phase.');alloc={}}catch(e){note('Host action failed: '+e.message)}}
async function lock(){let t=sum(alloc),limit=Math.floor(me.stats.treasury),r=round();if(!Number.isInteger(t)||t<0||t>limit)return note('Investment exceeds available treasury.');let choice={};for(let x of crisis().pol){let k=x[0],v=Number(alloc[k]||0);if(!Number.isInteger(v)||v<0)return note('Use non-negative whole credits only.');choice[k]=v}try{let result=await tx(g=>{let p=g?.players?.[pid];if(!g||g.phase!=='decision'||!p||p.decisions?.[r])return;if(sum(choice)>Math.floor(p.stats.treasury))return;p.decisions=p.decisions||{};p.decisions[r]={alloc:choice,at:Date.now()};return g});note(result.committed?'Your national strategy is locked.':'Could not lock strategy. Check your balance or phase.')}catch(e){note(e.message)}}
async function publish(){let resource=$('resource').value,qty=Number($('quantity').value),price=Number($('price').value),to=$('recipient').value;if(!Number.isSafeInteger(qty)||qty<1||qty>10000||!Number.isSafeInteger(price)||price<1||price>100000)return note('Enter whole-number units (1–10000) and price (1–100000).');try{let id='o'+pid.slice(0,6)+Date.now().toString(36);let r=round();let result=await tx(g=>{if(!g||g.phase!=='market'||!g.players?.[pid]||!['energy','supplies'].includes(resource))return;if(to!=='public'&&(!g.players[to]||to===pid))return;g.offers=g.offers||{};if(Object.values(g.offers).filter(o=>o.status==='open'&&o.from===pid).length>=10)return;let committed=Object.values(g.offers).filter(o=>o.status==='open'&&o.from===pid&&o.resource===resource).reduce((v,o)=>v+Number(o.qty||0),0);if(Number(g.players[pid].stats[resource]||0)<qty+committed)return;g.offers[id]={from:pid,to,resource,qty,price,round:r,status:'open',created:Date.now()};return g});note(result.committed?'Your offer is visible to eligible buyers.':'Offer not posted: unavailable resources, invalid recipient, or offer limit (10).')}catch(e){note(e.message)}}
async function cancel(id){try{let result=await tx(g=>{let o=g?.offers?.[id];if(!g||g.phase!=='market'||!o||o.from!==pid||o.status!=='open')return;o.status='cancelled';o.cancelled=Date.now();return g});note(result.committed?'Offer withdrawn.':'Could not withdraw offer.')}catch(e){note(e.message)}}
async function buy(id){let o=game?.offers?.[id];if(!o||o.status!=='open')return note('Offer no longer available.');let seller=country(game.players[o.from]);let buyer=country(me);let message=`BUY ${o.qty} ${o.resource==='energy'?'Energy':'Industrial Supplies'} from ${seller[2]} for ${o.price} credits?\n\nYOU GIVE: ${o.price} credits\nYOU RECEIVE: ${o.qty} ${o.resource}\n\nYOUR TREASURY: ${me.stats.treasury} → ${me.stats.treasury-o.price}\nYOUR ${o.resource.toUpperCase()}: ${me.stats[o.resource]} → ${me.stats[o.resource]+o.qty}\n\nTrade settles immediately for both countries.`;if(!confirm(message))return;try{let result=await tx(g=>{let offer=g?.offers?.[id],b=g?.players?.[pid],s=g?.players?.[offer?.from];if(!g||g.phase!=='market'||!offer||offer.status!=='open'||!b||!s||offer.from===pid)return;if(offer.to!=='public'&&offer.to!==pid)return;if(!Number.isSafeInteger(offer.price)||offer.price<1||!Number.isSafeInteger(offer.qty)||offer.qty<1||!['energy','supplies'].includes(offer.resource))return;if(b.stats.treasury<offer.price||s.stats[offer.resource]<offer.qty)return;b.stats.treasury-=offer.price;s.stats.treasury+=offer.price;b.stats[offer.resource]+=offer.qty;s.stats[offer.resource]-=offer.qty;offer.status='filled';offer.buyer=pid;offer.settled=Date.now();let filled=Object.values(g.offers||{}).filter(v=>v.round===g.round&&v.status==='filled');let buyerCount=filled.filter(v=>v.from===pid||v.buyer===pid).length;let sellerCount=filled.filter(v=>v.from===offer.from||v.buyer===offer.from).length;let boost=Math.min(1.6,offer.qty*.055)+(country(s)[4]!==country(b)[4]?.2:0);if(buyerCount<=2)b.stats.trade=clamp(b.stats.trade+boost,0,100);if(sellerCount<=2)s.stats.trade=clamp(s.stats.trade+boost,0,100);return g});note(result.committed?'Trade completed! Both countries updated immediately.':'Trade failed: offer sold, market closed or insufficient balance.')}catch(e){note('Trade failed: '+e.message)}}
function counter(id){let o=game?.offers?.[id];if(!o||o.status!=='open')return;marketTab='mine';tradeForm={resource:o.resource,qty:String(o.qty),price:String(o.price),to:o.from};render();let recipient=$('recipient');if(recipient)recipient.value=o.from;let res=$('resource');if(res)res.value=o.resource;let qty=$('quantity');if(qty)qty.value=o.qty;let pr=$('price');if(pr)pr.value=o.price;note('Counteroffer: edit the terms below and publish a private offer. You must offer resources you own.')}
try{let f=initializeApp(firebaseConfig);db=getDatabase(f);auth=getAuth(f);onAuthStateChanged(auth,u=>{if(!u){signInAnonymously(auth).catch(e=>$('app').innerHTML='<div class="panel bad">Firebase sign-in failed: '+esc(e.message)+'</div>');return;}uid=u.uid;pid=sessionStorage.getItem('nationWarsTabId');if(!pid){pid='p'+Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');sessionStorage.setItem('nationWarsTabId',pid)}let x;try{x=JSON.parse(sessionStorage.getItem('nationWarsSession')||'null')}catch{}if(x?.room&&x?.role){room=x.room;role=x.role;listen()}else login()})}catch(e){$('app').innerHTML='<div class="panel bad">'+esc(e.message)+'</div>'}
</script></body></html>
